<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de form</title>
</head>
<body>
    <h1>Ejemplo de formulario</h1>
    <fieldset>
        <legend>This is my form</legend>
        <form action="/actions/procesar.php" method="get" enctype="multipart/form-data">
            <div> 
                <!-- <label for="id">ID:</label> -->
                <input type="hidden" name="id" id="id" value="10" readonly>
            </div>
            <div> 
                <label for="name">Nombre:</label>
                <input type="text" name="name" id="name" placeholder="Digite su nombre" required>
            </div>
            <div> 
                <label for="edad">Edad:</label>
                <input type="number" name="edad" id="edad" placeholder="Digite su edad" required min="1" max="110">
            </div>
            <div> 
                <label for="fecha">Fecha:</label>
                <input type="date" name="fecha" id="fecha" placeholder="Digite su fecha de nacimiento" value="2026-10-24">
            </div>
            <div> 
                <label for="fecha">Fecha:</label>
                <input type="date" name="fecha" id="fecha" placeholder="Digite su fecha de nacimiento" value="2026-10-24">
            </div>
            <div> 
                <label for="color">Color:</label>
                <input type="color" name="fecha" id="color" placeholder="Seleccione color">
            </div>
            <div> 
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Digite su correo" required>
            </div>
            <div>
                <label for="pass">Contrasena</label>
                <input type="password" name="pass" id="pass" placeholder="digite su contrasena">
            </div>
            <div>
                <label for="pass2">Confirme su Contrasena</label>
                <input type="password" name="pass2" id="pass2" placeholder="confirme su contrasena">
            </div>
            <div>
                <label for="genero">Seleccione su genero</label>
                <input type="radio" name="genero" id="generom" value="M"> Masculino
                <input type="radio" name="genero" id="generof" value="F"> Femenino
            </div>
            <div>
                <label for="pais">pais</label>
                <select name="pais" id="pais" multiple>
                    <option value="sv" selected>El salvador</option>
                    <option value="uk">Reino Unido</option>
                    <option value="us">Estados Unidos</option>
                </select>
            </div>
            <div>
                <label for="foto">Subir su foto</label>
                <input type="file" name="foto" id="foto">
            </div>
            <div>
                <label for="hobby">Seleccione su hobbies</label>
                <input type="checkbox" name="hobby" id="hobby" value="1"> Futbol
                <input type="checkbox" name="hobby" id="hobby" value="2"> Basketball
                <input type="checkbox" name="hobby" id="hobby" value="3"> Volleyball
                <input type="checkbox" name="hobby" id="hobby" value="4"> PingPong
            </div>
            <div>
                <label for="direccion">Direccion</label>
                <textarea name="direccion" id="direccion" rows="5" cols="30"></textarea>
            </div>
            <input type="submit" value="Enviar">
        </form>
    </fieldset>
</body>
</html>
